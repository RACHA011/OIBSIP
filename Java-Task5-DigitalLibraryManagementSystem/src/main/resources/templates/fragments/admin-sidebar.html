<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="sidebar(active)" class="flex h-screen w-64 flex-shrink-0 flex-col justify-between border-r border-border bg-card p-6">
    <div>
        <div class="mb-8">
            <span class="font-display text-xl font-bold text-foreground">LMS Admin</span>
        </div>
        <div class="space-y-1">
            <a th:href="@{/admin/dashboard}"
               th:class="${active == 'dashboard'} ? 'block rounded-xl bg-primary-soft px-3 py-2.5 text-sm font-semibold text-primary' : 'block rounded-xl px-3 py-2.5 text-sm font-medium text-muted-foreground transition-colors hover:bg-secondary'">
                Dashboard
            </a>
            <a th:href="@{/admin/books}"
               th:class="${active == 'books'} ? 'block rounded-xl bg-primary-soft px-3 py-2.5 text-sm font-semibold text-primary' : 'block rounded-xl px-3 py-2.5 text-sm font-medium text-muted-foreground transition-colors hover:bg-secondary'">
                Books
            </a>
            <a th:href="@{/admin/issued}"
               th:class="${active == 'issued'} ? 'block rounded-xl bg-primary-soft px-3 py-2.5 text-sm font-semibold text-primary' : 'block rounded-xl px-3 py-2.5 text-sm font-medium text-muted-foreground transition-colors hover:bg-secondary'">
                Issued Books
            </a>
            <a th:href="@{/admin/members}"
               th:class="${active == 'members'} ? 'block rounded-xl bg-primary-soft px-3 py-2.5 text-sm font-semibold text-primary' : 'block rounded-xl px-3 py-2.5 text-sm font-medium text-muted-foreground transition-colors hover:bg-secondary'">
                Members
            </a>
            <a th:href="@{/admin/messages}"
               th:class="${active == 'messages'} ? 'block rounded-xl bg-primary-soft px-3 py-2.5 text-sm font-semibold text-primary' : 'block rounded-xl px-3 py-2.5 text-sm font-medium text-muted-foreground transition-colors hover:bg-secondary'">
                Messages
            </a>
        </div>
    </div>
    <a th:href="@{/logout}" class="block rounded-xl px-3 py-2.5 text-sm font-medium text-muted-foreground transition-colors hover:bg-secondary">Logout</a>
</nav>
</body>
</html>
