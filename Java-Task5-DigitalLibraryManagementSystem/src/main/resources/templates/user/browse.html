<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Browse Books - Library System</title>
    <th:block
      th:replace="~{fragments/tailwind-head :: tailwind-setup}"
    ></th:block>
  </head>
  <body class="flex min-h-screen bg-background">
    <div
      th:replace="~{fragments/member-sidebar :: sidebar(active='browse')}"
    ></div>
    <main class="flex-1 space-y-6 p-8">
      <div
        th:replace="~{fragments/topbar :: topbar(userName=${currentUserName})}"
      ></div>
      <div>
        <h1 class="font-display text-2xl font-bold text-foreground">
          Browse Books
        </h1>
        <p class="mt-1 text-sm text-muted-foreground">
          Find a title and borrow it from the shelf.
        </p>
      </div>

      <p
        th:if="${error}"
        class="rounded-xl bg-destructive-soft px-4 py-3 text-sm font-medium text-destructive"
        th:text="${error}"
      ></p>

      <div class="rounded-3xl bg-card p-6 shadow-soft">
        <div class="flex flex-wrap items-end gap-3">
          <form
            th:action="@{/user/search}"
            method="get"
            class="flex min-w-[220px] flex-1 items-end gap-3"
          >
            <div class="flex-1 space-y-2">
              <label class="block text-sm font-semibold text-foreground"
                >Search by title or author</label
              >
              <input
                type="text"
                name="q"
                th:value="${query}"
                placeholder="e.g. Clean Code"
                class="w-full rounded-xl border border-border bg-card px-4 py-3 text-sm text-foreground placeholder:text-muted-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/25"
              />
            </div>
            <button
              type="submit"
              class="h-[46px] rounded-full bg-primary px-6 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90"
            >
              Search
            </button>
          </form>

          <form
            th:action="@{/user/browse}"
            method="get"
            class="w-full space-y-2 sm:w-56"
          >
            <label class="block text-sm font-semibold text-foreground"
              >Category</label
            >
            <select
              name="category"
              onchange="this.form.submit()"
              class="w-full rounded-xl border border-border bg-card px-4 py-3 text-sm text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/25"
            >
              <option value="">All Categories</option>
              <option value="Fiction" th:selected="${category == 'Fiction'}">
                Fiction
              </option>
              <option
                value="Non-Fiction"
                th:selected="${category == 'Non-Fiction'}"
              >
                Non-Fiction
              </option>
              <option value="Science" th:selected="${category == 'Science'}">
                Science
              </option>
              <option
                value="Technology"
                th:selected="${category == 'Technology'}"
              >
                Technology
              </option>
              <option value="History" th:selected="${category == 'History'}">
                History
              </option>
            </select>
          </form>
        </div>
      </div>

      <div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
        <div
          th:each="book, iter : ${books}"
          class="flex flex-col rounded-3xl bg-card p-5 shadow-soft transition-shadow hover:shadow-lg"
        >
          <div
            th:class="${iter.index % 3 == 0} ? 'mb-4 flex h-28 items-center justify-center rounded-2xl bg-primary-soft text-primary' : (${iter.index % 3 == 1} ? 'mb-4 flex h-28 items-center justify-center rounded-2xl bg-warning-soft text-warning' : 'mb-4 flex h-28 items-center justify-center rounded-2xl bg-secondary text-muted-foreground')"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-8 w-8"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"
              />
            </svg>
          </div>
          <h3
            class="font-display text-base font-bold leading-snug text-foreground"
            th:text="${book.title}"
          ></h3>
          <p
            class="mt-1 text-sm text-muted-foreground"
            th:text="'by ' + ${book.author}"
          ></p>
          <div class="mt-3 flex flex-wrap items-center gap-2">
            <span
              class="inline-flex items-center rounded-full bg-secondary px-3 py-1 text-xs font-semibold text-muted-foreground"
              th:text="${book.category}"
            ></span>
            <span
              th:class="${book.availableQuantity > 0} ? 'inline-flex items-center rounded-full bg-primary-soft px-3 py-1 text-xs font-semibold text-primary' : 'inline-flex items-center rounded-full bg-warning-soft px-3 py-1 text-xs font-semibold text-warning'"
              th:text="${book.availableQuantity} + ' / ' + ${book.totalQuantity} + ' available'"
            ></span>
          </div>
          <form
            th:if="${book.availableQuantity > 0}"
            th:action="@{'/user/issue/' + ${book.id}}"
            method="post"
            class="mt-5 pt-1"
          >
            <button
              type="submit"
              class="w-full rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90"
            >
              Issue
            </button>
          </form>
          <form
            th:unless="${book.availableQuantity > 0}"
            th:action="@{'/user/reserve/' + ${book.id}}"
            method="post"
            class="mt-5 pt-1"
          >
            <button
              type="submit"
              class="w-full rounded-full border border-border bg-transparent px-5 py-2.5 text-sm font-semibold text-foreground transition-colors hover:bg-secondary"
            >
              Reserve
            </button>
          </form>
        </div>
      </div>
      <p
        th:if="${#lists.isEmpty(books)}"
        class="rounded-2xl border border-dashed border-border p-8 text-center text-sm text-muted-foreground"
      >
        No books found.
      </p>
    </main>
  </body>
</html>
