<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Contact the Library - Library System</title>
    <th:block
      th:replace="~{fragments/tailwind-head :: tailwind-setup}"
    ></th:block>
  </head>
  <body class="flex min-h-screen bg-background">
    <div
      th:replace="~{fragments/member-sidebar :: sidebar(active='contact')}"
    ></div>
    <main class="flex-1 space-y-6 p-8">
      <div
        th:replace="~{fragments/topbar :: topbar(userName=${currentUserName})}"
      ></div>
      <div>
        <h1 class="font-display text-2xl font-bold text-foreground">
          Contact the Library
        </h1>
        <p class="mt-1 text-sm text-muted-foreground">
          We usually reply within one working day.
        </p>
      </div>

      <div class="rounded-3xl bg-card p-6 shadow-soft">
        <div class="mx-auto max-w-xl">
          <p
            th:if="${success}"
            class="mb-5 rounded-xl bg-primary-soft px-4 py-3 text-sm font-medium text-primary"
            th:text="${success}"
          ></p>

          <form th:action="@{/user/contact}" method="post" class="space-y-4">
            <div>
              <label class="mb-2 block text-sm font-semibold text-foreground"
                >Name</label
              >
              <input
                type="text"
                name="name"
                required
                class="w-full rounded-xl border border-border bg-card px-4 py-3 text-sm text-foreground placeholder:text-muted-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/25"
              />
            </div>
            <div>
              <label class="mb-2 block text-sm font-semibold text-foreground"
                >Email</label
              >
              <input
                type="email"
                name="email"
                required
                class="w-full rounded-xl border border-border bg-card px-4 py-3 text-sm text-foreground placeholder:text-muted-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/25"
              />
            </div>
            <div>
              <label class="mb-2 block text-sm font-semibold text-foreground"
                >Message</label
              >
              <textarea
                name="message"
                rows="5"
                required
                class="w-full rounded-xl border border-border bg-card px-4 py-3 text-sm text-foreground placeholder:text-muted-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/25"
              ></textarea>
            </div>
            <button
              type="submit"
              class="rounded-full bg-primary px-6 py-3 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90"
            >
              Send
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
